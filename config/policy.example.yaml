  gross_exposure_max_pct_nav: 70
  risk_off_exposure_max_pct_nav: 30
  max_new_positions_per_day: 2
  weekly_turnover_soft_max_pct: 35
  stop_new_buys_daily_loss_pct: 1.5
  caution_drawdown_pct: 5
  risk_off_drawdown_pct: 8
  freeze_drawdown_pct: 12

screening:
  min_median_daily_turnover_cny_20d: null
